services:
  relay:
    build:
      context: .
      dockerfile: sync_server/Dockerfile
    image: musicplayerpro-relay:latest
    container_name: musicplayerpro-relay
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - relay-data:/data
    environment:
      # Cambia este valor en producción: protege los tokens de los dispositivos.
      MUSICPLAYERPRO_RELAY_PEPPER: "${MUSICPLAYERPRO_RELAY_PEPPER:-cambia-esto-en-produccion}"
      MUSICPLAYERPRO_RELAY_DB: /data/relay.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8099/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  relay-data:
