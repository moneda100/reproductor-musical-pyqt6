<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F0F0F" />
  <title>Music Player Pro</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-bar">
    <h1>Music Player Pro</h1>
    <span id="status-pill" class="pill pill-offline">Sin conexión</span>
  </header>

  <main>
    <section id="view-now-playing" class="view">
      <div class="cover-wrapper">
        <img id="cover" alt="Portada" />
        <div class="cover-placeholder" id="cover-placeholder">♪</div>
      </div>
      <h2 id="track-title">Sin reproducción</h2>
      <p id="track-artist" class="muted"></p>
      <div class="progress">
        <span id="position">0:00</span>
        <div class="bar"><div id="progress-fill" class="fill"></div></div>
        <span id="duration">0:00</span>
      </div>
      <div class="controls">
        <button id="btn-prev" aria-label="Pista anterior">⏮</button>
        <button id="btn-play" class="primary" aria-label="Reproducir o pausar">▶</button>
        <button id="btn-next" aria-label="Pista siguiente">⏭</button>
      </div>
      <p id="owner-note" class="muted small"></p>
    </section>

    <section id="view-queue" class="view hidden">
      <h2>Cola</h2>
      <ul id="queue" class="list"></ul>
    </section>

    <section id="view-library" class="view hidden">
      <h2>Biblioteca</h2>
      <div class="tabs">
        <button class="tab active" data-tab="playlists">Playlists</button>
        <button class="tab" data-tab="favorites">Favoritos</button>
        <button class="tab" data-tab="history">Historial</button>
      </div>
      <ul id="library-items" class="list"></ul>
    </section>

    <section id="view-settings" class="view hidden">
      <h2>Ajustes</h2>
      <label class="field">
        <span>URL del hub</span>
        <input id="hub-url" type="url" placeholder="https://mi-relay.example.com" />
      </label>
      <label class="field">
        <span>Código de emparejamiento</span>
        <input id="pair-code" type="text" inputmode="numeric" maxlength="6" placeholder="123456" />
      </label>
      <div class="row">
        <button id="btn-pair" class="primary">Emparejar</button>
        <button id="btn-takeover">Tomar el control</button>
        <button id="btn-disconnect" class="danger">Desconectar</button>
      </div>
      <h3>Dispositivos</h3>
      <ul id="devices" class="list"></ul>
    </section>
  </main>

  <nav class="tab-bar">
    <button class="nav active" data-view="now-playing">♪<span>Ahora</span></button>
    <button class="nav" data-view="queue">≡<span>Cola</span></button>
    <button class="nav" data-view="library">▤<span>Biblioteca</span></button>
    <button class="nav" data-view="settings">⚙<span>Ajustes</span></button>
  </nav>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
